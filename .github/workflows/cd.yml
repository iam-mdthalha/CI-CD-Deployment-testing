# =============================================================================
# CD Pipeline - Production Deployment via SSM (Blue-Green)
# =============================================================================
#
# Triggers:  
#   1.  Automatically after CI completes on main
#   2. Manual trigger
#
# =============================================================================

name: CD Pipeline - Deploy to Production

on:
  # 🔥 TRIGGER AFTER CI COMPLETES ON MAIN
  workflow_run:
    workflows: ["ci"]                    # Must match your CI workflow name
    types: 
      - completed
    branches: 
      - main

  # Manual trigger option
  workflow_dispatch:

# Prevent concurrent deployments
concurrency: 
  group: production-deployment
  cancel-in-progress: false

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-frontend
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  # ===========================================================================
  # JOB 0: Check if CI was successful
  # ===========================================================================
  check-ci: 
    name: 🔍 Verify CI Success
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    
    steps:
      - name: Check CI conclusion
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" == "success" ]; then
              echo "✅ CI passed, proceeding with deployment"
              echo "should_deploy=true" >> $GITHUB_OUTPUT
            else
              echo "❌ CI failed (conclusion: ${{ github.event.workflow_run.conclusion }})"
              echo "should_deploy=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "✅ Manual trigger, proceeding with deployment"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          fi

  # ===========================================================================
  # JOB 1: Build and Push Docker Image
  # ===========================================================================
  build-and-push:
    name:  📦 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: check-ci
    if: needs.check-ci.outputs.should_deploy == 'true'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      
      - name: 🏷️ Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images:  ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      
      - name:  🔐 Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name:  🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 📦 Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ecommerce-frontend
          file: ./ecommerce-frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 📋 Output image info
        run: |
          echo "### 🐳 Docker Image Built & Pushed" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.DOCKER_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 2: Deploy via SSM (Blue-Green)
  # ===========================================================================
  deploy: 
    name: 🚀 Deploy to Production (SSM)
    runs-on: ubuntu-latest
    needs: build-and-push
    
    environment:
      name:  production
    
    steps: 
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: ✅ Verify EC2 instance is managed by SSM
        run: |
          echo "Checking SSM connectivity..."
          
          INSTANCE_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'InstanceInformationList[0]. PingStatus' \
            --output text)
          
          if [ "$INSTANCE_STATUS" != "Online" ]; then
            echo "❌ EC2 instance is not online in SSM"
            echo "Instance ID: ${{ secrets.EC2_INSTANCE_ID }}"
            echo "Status: $INSTANCE_STATUS"
            exit 1
          fi
          
          echo "✅ EC2 instance is online in SSM"
      
      - name:  🚀 Deploy via SSM (Blue-Green)
        id: deploy
        run: |
          echo "Starting Blue-Green deployment..."
          echo "Image: ${{ env.DOCKER_IMAGE }}:latest"
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions Deployment - ${{ github.event.workflow_run.head_sha || github.sha }}" \
            --parameters "commands=[\"sudo /usr/local/bin/deploy-app.sh ${{ env.DOCKER_IMAGE }}:latest\"]" \
            --timeout-seconds 300 \
            --output text \
            --query 'Command.CommandId')
          
          echo "Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          
          echo "Waiting for deployment to complete..."
          
          for i in {1.. 60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            
            echo "Status: $STATUS ($i/60)"
            
            if [ "$STATUS" == "Success" ]; then
              echo "✅ Deployment successful!"
              break
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ] || [ "$STATUS" == "TimedOut" ]; then
              echo "❌ Deployment failed with status:  $STATUS"
              
              echo ""
              echo "=== Error Output ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query 'StandardErrorContent' \
                --output text || true
              
              exit 1
            fi
            
            sleep 5
          done
          
          echo ""
          echo "=== Deployment Output ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardOutputContent' \
            --output text
      
      - name: 📋 Deployment summary
        run:  |
          echo "### 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.DOCKER_IMAGE }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.event.workflow_run.head_sha || github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Method** | SSM (Blue-Green) |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 3: Post-Deployment Health Check
  # ===========================================================================
  health-check: 
    name: 🏥 Post-Deployment Health Check
    runs-on:  ubuntu-latest
    needs: deploy
    
    steps: 
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name:  🏥 Run health check
        run: |
          echo "Running health checks..."
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"docker ps --format 'table {{.Names}}\t{{.Status}}' | grep ecommerce && cat /var/lib/deployment/state.json\"]" \
            --output text \
            --query 'Command. CommandId')
          
          sleep 10
          
          echo "=== Health Check Results ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardOutputContent' \
            --output text
      
      - name: 📋 Health check summary
        run: |
          echo "### 🏥 Health Check Complete" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment verified" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 4: Skipped (CI Failed)
  # ===========================================================================
  skipped:
    name: ⏭️ Skipped (CI not successful)
    runs-on: ubuntu-latest
    needs: check-ci
    if: needs.check-ci.outputs.should_deploy == 'false'
    
    steps:
      - name: 📋 Skip summary
        run: |
          echo "### ⏭️ Deployment Skipped" >> $GITHUB_STEP_SUMMARY
          echo "CI did not pass. Deployment cancelled." >> $GITHUB_STEP_SUMMARY
          echo "**CI Conclusion:** \`${{ github.event.workflow_run.conclusion }}\`" >> $GITHUB_STEP_SUMMARY