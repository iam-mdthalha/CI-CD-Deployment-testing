# =============================================================================
# CD Pipeline - Production Deployment via SSM (Blue-Green)
# =============================================================================
#
# Triggers:  
#   1. Automatically after merge (push) to main
#   2. Manual trigger
#
# =============================================================================

name: CD Pipeline - Deploy to Production

on:
  # ✅ TRIGGER AFTER MERGE TO MAIN (FIXED)
  push:
    branches:
      - main

  # Manually trigger option
  workflow_dispatch:

# Prevent concurrent deployment
concurrency: 
  group: production-deployment
  cancel-in-progress: false

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-frontend
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  # ===========================================================================
  # JOB 0: Check if CI was successful
  # ===========================================================================
  check-ci: 
    name: 🔍 Verify CI Success
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    
    steps:
      - name: Check CI conclusion
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" == "success" ]; then
              echo "✅ CI passed, proceeding with deployment"
              echo "should_deploy=true" >> $GITHUB_OUTPUT
            else
              echo "❌ CI failed (conclusion: ${{ github.event.workflow_run.conclusion }})"
              echo "should_deploy=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "✅ Manual or push trigger, proceeding with deployment"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          fi

  # ===========================================================================
  # JOB 1: Build and Push Docker Image
  # ===========================================================================
  build-and-push:
    name: 📦 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: check-ci
    if: needs.check-ci.outputs.should_deploy == 'true'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      
      - name: 🏷️ Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      
      - name: 🔐 Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 📦 Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ecommerce-frontend
          file: ./ecommerce-frontend/Dockerfile
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 📋 Output image info
        run: |
          echo "### 🐳 Docker Image Built & Pushed" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.DOCKER_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 2: Deploy via SSM (Blue-Green)
  # ===========================================================================
  deploy: 
    name: 🚀 Deploy to Production (SSM)
    runs-on: ubuntu-latest
    needs: build-and-push
    
    environment:
      name: production
    
    steps: 
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: ✅ Verify EC2 instance is managed by SSM
        run: |
          echo "Checking SSM connectivity..."
          
          INSTANCE_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)
          
          if [ "$INSTANCE_STATUS" != "Online" ]; then
            echo "❌ EC2 instance is not online in SSM"
            exit 1
          fi
          
          echo "✅ EC2 instance is online in SSM"
      
      - name: 🚀 Deploy via SSM (Blue-Green)
        run: |
          echo "Starting Blue-Green deployment..."
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"sudo /usr/local/bin/deploy-app.sh ${{ env.DOCKER_IMAGE }}:latest\"]"

  # ===========================================================================
  # JOB 3: Post-Deployment Health Check
  # ===========================================================================
  health-check: 
    name: 🏥 Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: 📋 Health check summary
        run: |
          echo "### 🏥 Health Check Complete" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment verified" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 4: Skipped (CI Failed)
  # ===========================================================================
  skipped:
    name: ⏭️ Skipped (CI not successful)
    runs-on: ubuntu-latest
    needs: check-ci
    if: needs.check-ci.outputs.should_deploy == 'false'
    
    steps:
      - name: 📋 Skip summary
        run: |
          echo "### ⏭️ Deployment Skipped" >> $GITHUB_STEP_SUMMARY
          echo "CI did not pass. Deployment cancelled." >> $GITHUB_STEP_SUMMARY
